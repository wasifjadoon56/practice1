<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>please fill out the below form</p>
    <hr>

    <h2>Personal details</h2>

    <form>
         <label for="name">first name</label>
         <input type="text" name="name" id="name" placeholder="e.g:hamza">
         <br><br>
         <label for="surname">last name</label>
         <input type="text" name="surname" id="surname" placeholder="e.g:mahaz">
         <br><br>
         <label for="date of birth">date of birth</label>
         <input type="date" name="date of birth" id="date of birth">
         <br><br>


         <h3>gender</h3>
         <label for="male">male</label>
          <input type="radio" name="gender" id="male" value="male">
          <br><br>
         <label for="female">female</label>
         <input type="radio" name="gender" id="female" value="female">
         <br><br>
         <label for="other">other</label>
         <input type="radio" name="gender" id="other" value="other"> 
         
         <h3>upload your photo</h3>
         <input type="file" name="file">
         <hr>

         <h2>contact information</h2>
         <label for="email">email address</label>
         <input type="email" name="email" id="email" placeholder="e.g: you@example.com">
         <br><br>
         <label for="phone">phone</label>
         <input type="tel" name="phone" id="phone" placeholder="e.g:03235617894">
         <br><br>
         <label for="address">mailing address</label>
         <br><br>
         <textarea name="address" id="address" rows="5" cols="20"></textarea>
         <hr>


         <h2>academic information</h2>
         <p>select your course:</p>
         <label for="course">select your course</label>
         <select name="course" id="course">
             <option value="computer sciene">computer sciene</option>
             <option value="math">math</option>
             <option value="english">english</option>
             <option value="physics">physics</option>
             <option value="chemistry">chemistry</option></select>
             <br><br>

          <h2>extracurricural activities</h2>
             <label for="sports">sports</label>
             <input type="checkbox" name="interest" id="sports" value="sports">
             <br><br>         
             <label for="music">music</label>
             <input type="checkbox" name="interest" id="music" value="music">
             <br><br>       
             <label for="technology">technology</label>
             <input type="checkbox" name="interest" id="tchnology" value="technology">
             <br><br>        
             <label for="voluntering">voluntering</label>
             <input type="checkbox" name="interest" id="voluntering" value="voluntering">
             <br><br>           
             <label for="art">art</label> 
             <input type="checkbox" name="interest" id="art" value="art">
             <br><br>
             <label for="entertainment">entertainment</label>
             <input type="checkbox" name="interest" id="intertainment" value="intertainment">
             <hr>


             <h2>create your account</h2>
             <label for="password">create your password</label>
             <input type="password" name="password" id="password">
             <br><br>
             <label for="security question">security question</label>
             <input type="text" name="security question" id="security question" placeholder="what was your first,s pet name">
             <br><br>
             <label for="security">security answer</label>
             <input type="text" name="security" id="security">
             <br><br>
             <label for="permission">i agree to the turms and condition</label>
             <input type="radio" name="permission" id="i agree to the turms and condition" value="i agree to the turms and condition"> 
             <hr>
             
             
             <button type="submit">regisration</button>
             <button type="reset">clear form</button>
         


    </form>







</body>
</html>
